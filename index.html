<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My First Website</title>
<style>
body{font-family:Arial;text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);color:white;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:20px}
.card{background:white;color:#333;border-radius:20px;padding:30px;max-width:400px;margin:0 auto;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
h1{font-size:24px}
#fact{font-size:18px;margin:20px 0;min-height:60px}
button{background:#667eea;color:white;border:none;padding:15px 30px;border-radius:50px;font-size:18px;cursor:pointer}
.hearts{margin-top:20px;font-size:20px}
.arrow{font-size:40px;animation:bounce 1s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div class="card">
<div class="arrow">👇</div>
<h1>Random Fun Facts! 🤯</h1>
<p id="fact">Pindutin mo yung button para sa fun fact!</p>
<button onclick="newFact()">Bagong Fact! ✨</button>
<div class="hearts">❤️ 523 likes</div>
<p style="margin-top:15px">👉 Share mo tong link na to!</p>
</div>
<script>
const facts=["Octopus may 3 puso! 🐙","Honey hindi nasisira kahit 3000 years! 🍯","Banana ay berry pero strawberry hindi! 🍌","May 8 billion tao sa mundo! 🌍","Pusang mahilig matulog 16 hours a day! 😺","Tubig ang bumubuo ng 60% ng katawan natin! 💧","Ang araw ay 1.3 million Earth ang kasya! ☀️"];
function newFact(){document.getElementById('fact').innerText=facts[Math.floor(Math.random()*facts.length)]}
newFact();
</script>
</body>
</html>
